<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Petit Rag </title>
	<link rel="stylesheet" href="./style.css">
	<script src="./scripts.js" defer></script>
</head>
<body>
	<main class="petit-rag">
		<section class="chat-window">
			<div class="history">
			</div>

			<div class="prompt-form">
				<textarea class="prompt-input" placeholder="Waiting for a question ...">
				</textarea>
				<section class="prompt-form-buttons">
					<button class="button-prompt-sender">></button>
					<button class="button-add-documents">+</button>
					<button class="button-delete-documents">-</button>
				</section>
			</div>

		</section>
	</main>
</body>
